<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouFadeTube</title>
  <style>
    :root {
      color-scheme: dark light;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 2rem 1rem 4rem;
      background: radial-gradient(circle at top, #1e3c72, #1e2a38);
      color: #f7f7f7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }

    h1 {
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin: 0;
    }

    form {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 640px;
      width: 100%;
    }

    input[type="url"] {
      flex: 1 1 320px;
      padding: 0.75rem 1rem;
      border-radius: 999px;
      border: none;
      outline: none;
      font-size: 1rem;
      color: #1f1f1f;
    }

    button[type="submit"] {
      padding: 0.75rem 1.5rem;
      border-radius: 999px;
      border: none;
      background: linear-gradient(135deg, #ff4081, #ffd740);
      color: #1f1f1f;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    button[type="submit"]:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.25);
    }

    #playerContainer {
      display: grid;
      gap: 1.5rem;
      width: min(960px, 100%);
    }

    .player-frame {
      aspect-ratio: 16 / 9;
      width: 100%;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 1rem;
      overflow: hidden;
      position: relative;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.35);
    }

    .player-frame iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .instructions {
      max-width: 640px;
      text-align: center;
      line-height: 1.6;
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <h1>YouFadeTube</h1>

  <form id="videoForm">
    <input id="videoUrl" type="url" name="videoUrl" placeholder="Cole aqui a URL do vídeo do YouTube" required>
    <button type="submit">Adicionar vídeo</button>
  </form>

  <p class="instructions">
    Cole uma URL de vídeo do YouTube e pressione "Adicionar vídeo" para iniciar a reprodução. Adicione um segundo vídeo para
    realizar o efeito de crossfade automático.
  </p>

  <div id="playerContainer"></div>

  <script>
    const CROSSFADE_DURATION = 6000;
    const STEP_INTERVAL = 200;

    let currentPlayer = null;
    let currentWrapper = null;
    let crossfadeTimer = null;

    function extractVideoId(url) {
      try {
        const parsed = new URL(url.trim());
        if (parsed.hostname.includes('youtu.be')) {
          return parsed.pathname.substring(1);
        }
        if (parsed.searchParams.has('v')) {
          return parsed.searchParams.get('v');
        }
        const pathname = parsed.pathname;
        if (pathname.startsWith('/embed/')) {
          return pathname.split('/')[2];
        }
        return null;
      } catch (error) {
        return null;
      }
    }

    function handleFormSubmit(event) {
      event.preventDefault();
      const input = document.getElementById('videoUrl');
      const videoId = extractVideoId(input.value);
      if (!videoId) {
        alert('Não foi possível identificar o ID do vídeo. Verifique a URL informada.');
        return;
      }
      loadVideo(videoId);
      input.value = '';
    }

    function loadVideo(videoId) {
      const container = document.getElementById('playerContainer');
      const wrapper = document.createElement('div');
      wrapper.className = 'player-frame';
      const uniqueId = `player-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
      wrapper.id = uniqueId;
      container.appendChild(wrapper);

      new YT.Player(uniqueId, {
        videoId,
        playerVars: {
          autoplay: 1,
          controls: 1,
          rel: 0
        },
        events: {
          onReady: (event) => onPlayerReady(event, wrapper)
        }
      });
    }

    function onPlayerReady(event, wrapper) {
      const player = event.target;
      if (!currentPlayer) {
        currentPlayer = player;
        currentWrapper = wrapper;
        player.setVolume(100);
        player.playVideo();
        return;
      }

      if (crossfadeTimer) {
        clearInterval(crossfadeTimer);
        crossfadeTimer = null;
      }

      const previousPlayer = currentPlayer;
      const previousWrapper = currentWrapper;

      currentPlayer = player;
      currentWrapper = wrapper;

      player.setVolume(0);
      player.playVideo();

      startCrossfade(previousPlayer, player, () => {
        try {
          previousPlayer.stopVideo();
          previousPlayer.destroy();
        } catch (error) {
          console.warn('Não foi possível destruir o player anterior:', error);
        }
        if (previousWrapper && previousWrapper.parentElement) {
          previousWrapper.remove();
        }
      });
    }

    function startCrossfade(fromPlayer, toPlayer, onComplete) {
      const steps = Math.ceil(CROSSFADE_DURATION / STEP_INTERVAL);
      let currentStep = 0;

      crossfadeTimer = setInterval(() => {
        currentStep += 1;
        const progress = Math.min(currentStep / steps, 1);
        const fadingOutVolume = Math.round((1 - progress) * 100);
        const fadingInVolume = Math.round(progress * 100);

        try {
          fromPlayer.setVolume(Math.max(fadingOutVolume, 0));
        } catch (error) {
          console.warn('Erro ao ajustar o volume do player original:', error);
        }

        try {
          toPlayer.setVolume(Math.min(fadingInVolume, 100));
        } catch (error) {
          console.warn('Erro ao ajustar o volume do novo player:', error);
        }

        if (progress >= 1) {
          clearInterval(crossfadeTimer);
          crossfadeTimer = null;
          if (typeof onComplete === 'function') {
            onComplete();
          }
        }
      }, STEP_INTERVAL);
    }

    document.getElementById('videoForm').addEventListener('submit', handleFormSubmit);

    const tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    const firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    window.onYouTubeIframeAPIReady = function () {
      // API carregada. O player será criado sob demanda.
    };
  </script>
</body>
</html>
